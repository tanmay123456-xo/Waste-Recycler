packages:
  "recharts": "For rendering beautiful waste statistics charts"
  "framer-motion": "For page transitions, list animations, and hero animations"
  "clsx": "Utility for constructing className strings conditionally"
  "tailwind-merge": "Utility for merging tailwind classes safely"
  "date-fns": "For formatting dates into human-readable strings"
  "lucide-react": "For UI icons"

images:
  - path: "artifacts/waste-recycling/public/images/hero-bg.png"
    description: "Abstract, soft eco-friendly background with lush green gradients, subtle modern glassmorphism shapes, and gentle leaf motifs. Professional, clean, and bright."
    aspect_ratio: "16:9"
  - path: "artifacts/waste-recycling/public/images/logo-icon.png"
    description: "Minimalist geometric logo mark of a glowing green leaf turning into a continuous recycling arrow loop, on a transparent background."
    aspect_ratio: "1:1"

notes:
  - Using generated Orval hooks from @workspace/api-client-react
  - Implementing a premium green/eco-themed aesthetic with Tailwind v4
  - Form mutations wrap payloads in { data: ... } per Orval generation
