kind = "web"
previewPath = "/"
title = "Waste Recycling Reward System"
version = "1.0.0"
id = "artifacts/waste-recycling"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 21339
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/waste-recycling run dev"

[services.env]
PORT = "21339"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/waste-recycling", "run", "build"]
publicDir = "artifacts/waste-recycling/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
